<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Form validation</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="script.js"></script>
    </head>
    <body class="bg-gray-100 flex"> 
        <div>
            <h2> Register here</h2>
        </div>

        <div>
            <form onsubmit="return checkdata()" action="">

                <label for="name"> Enter your name: </label><br>
                <input type="text" id="name" name="name" placeholder="John Doe">
                <p id="usernameError" style="color: red; font-size: 12px;"></p>

                <label> Enter email address:</label><br>
                <input type="text" id="email" name="email" placeholder="abc@gmail.com">
                <p id="emailError" style="color: red; font-size: 12px;"></p>

                <input type="submit" value="Submit">
                <input type="reset" value="Reset">

            </form>
        </div>

    </body>
</html>
